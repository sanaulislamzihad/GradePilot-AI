# Serves the built frontend and forwards /api to the backend on the same origin,
# so the httpOnly refresh cookie works without CORS.
upstream gradepilot_api {
    server api:8000;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Matches the backend's MAX_REQUEST_SIZE_MB; applies to chunked uploads too.
    client_max_body_size 60m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://gradepilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append): the API trusts this header for rate limits and audit logs.
        # Behind another proxy or load balancer, set the real client address with the
        # realip module (set_real_ip_from / real_ip_header) so $remote_addr is correct.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Marking and OCR requests can take several minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets never change, so browsers may keep them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes all serve index.html, which must always be revalidated.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
